<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Face Attendance System</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px;">

  <div class="card" style="width: 100%; max-width: 540px; padding: 36px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="logo-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 1.4rem;">FA</div>
      <h2>Create Account</h2>
      <p style="color: var(--c-slate); font-size: 0.9rem; margin-top: 4px;">Register as a student / employee (Role: User)</p>
    </div>

    <form action="login.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="e.g. Jana Mohamed" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@miu.edu.eg" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="identifier">Student / Employee ID</label>
          <input type="text" id="identifier" class="form-control" placeholder="2026-0914" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="department">Department</label>
          <select id="department" class="form-control">
            <option>Computer Science</option>
            <option>Software Engineering</option>
            <option>Information Technology</option>
            <option>Business Administration</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+20 100 123 4567">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password_confirm">Confirm Password</label>
          <input type="password" id="password_confirm" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--c-slate);">
      Already have an account? <a href="login.html" style="font-weight: 600; color: var(--c-ink);">Sign In</a>
    </div>
  </div>

</body>
</html>
