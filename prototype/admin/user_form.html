<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form — Face Attendance</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">FA</div>
        <div>
          <div class="logo-text">FaceAttendance</div>
          <div class="logo-sub">Admin Console</div>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-label">Main Navigation</li>
        <li class="menu-item"><a href="dashboard.html" class="menu-link"><svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg> Dashboard</a></li>
        <li class="menu-item"><a href="users.html" class="menu-link active"><svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg> User Management</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-avatar">AD</div>
        <div class="user-info">
          <div class="user-name">Ahmed Mahmoud</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="navbar">
        <div class="navbar-left">
          <button class="mobile-toggle"><svg style="width:24px;height:24px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="page-title-nav">User Account Editor</div>
        </div>
      </header>

      <main class="content-body">
        <div class="card reveal" style="max-width: 680px; margin: 0 auto;">
          <div class="card-header">
            <h3 class="card-title">User Account Details</h3>
            <a href="users.html" class="btn btn-secondary btn-sm">Back to List</a>
          </div>

          <form action="users.html" method="GET">
            <div class="form-group">
              <label class="form-label" for="name">Full Name</label>
              <input type="text" id="name" class="form-control" value="Jana Mohamed">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" value="jana@miu.edu.eg">
              </div>

              <div class="form-group">
                <label class="form-label" for="identifier">Student / Employee ID</label>
                <input type="text" id="identifier" class="form-control" value="2026-0914">
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="role">Role</label>
                <select id="role" class="form-control">
                  <option selected>user</option>
                  <option>admin</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="status">Account Status</label>
                <select id="status" class="form-control">
                  <option selected>active</option>
                  <option>inactive</option>
                </select>
              </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
              <a href="users.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Save User Record</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

</body>
</html>
